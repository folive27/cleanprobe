[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanprobe"
version = "0.1.0"
description = "Minimal TLS endpoint prober and VLESS/REALITY link validator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "frank0live" }]
dependencies = ["cryptography>=41"]

[project.scripts]
cleanprobe = "cleanprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
